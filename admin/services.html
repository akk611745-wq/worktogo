<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkToGo Admin — Services</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="admin-shell">
  <div id="shell-sidebar"></div>
  <div class="main-wrap">
    <div id="shell-topbar"></div>
    <main class="page-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Service Control</h1>
          <p class="page-subtitle" id="service-count">Loading…</p>
        </div>
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="card-body" style="padding-bottom:12px">
          <div class="page-header" style="padding:0;margin-bottom:12px">
            <div>
              <h2 class="page-title" style="font-size:16px">Service Operations Board</h2>
              <p class="page-subtitle" id="booking-count">Loading service bookings… Verify customer/vendor by phone or WhatsApp before closing actions.</p>
            </div>
            <button class="btn btn-ghost btn-sm" onclick="loadServiceBookings()">Refresh</button>
          </div>
          <div class="filter-bar" style="gap:8px;flex-wrap:wrap;margin-top:10px">
            <input class="form-control" id="booking-search" placeholder="Booking ID, name, vendor…" style="max-width:220px">
            <input class="form-control" id="booking-phone" placeholder="Customer phone" style="max-width:160px">
            <input class="form-control" id="booking-vendor" placeholder="Vendor ID" style="max-width:110px">
            <select class="form-control" id="booking-status" style="max-width:150px">
              <option value="">All Status</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="in_progress">In Progress</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option>
            </select>
            <button class="btn btn-primary btn-sm" onclick="loadServiceBookings()">Apply</button>
            <button class="btn btn-ghost btn-sm" onclick="resetBookingFilters()">Reset</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>BOOKING</th><th>CUSTOMER</th><th>SERVICE</th><th>SCHEDULED</th><th>VENDOR</th><th>STATUS</th><th>PAYMENT</th><th>ACTIONS</th></tr>
            </thead>
            <tbody id="service-bookings-tbody">
              <tr class="loading-row"><td colspan="8"><div class="spinner" style="margin:auto"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-body" style="padding-bottom:12px">
          <div class="filter-bar">
            <div class="search-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="text" id="search-input" class="form-control" placeholder="Search services…">
            </div>
            <select id="status-filter" class="form-control" style="width:140px">
              <option value="">All Status</option>
              <option value="enabled">Enabled</option>
              <option value="disabled">Disabled</option>
            </select>
            <button class="btn btn-ghost btn-sm" id="apply-filter">Filter</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>SERVICE</th><th>VENDOR</th><th>CATEGORY</th><th>BASE PRICE</th><th>BOOKINGS</th><th>STATUS</th><th>ACTIONS</th></tr>
            </thead>
            <tbody id="services-tbody">
              <tr class="loading-row"><td colspan="7"><div class="spinner" style="margin:auto"></div></td></tr>
            </tbody>
          </table>
        </div>
        <div class="card-body" style="padding-top:8px">
          <div class="pagination" id="services-pagination"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<div id="toast-container"></div>
<script src="config.js"></script>
<script src="shared/api.js"></script>
<script src="shared/auth.js"></script>
<script src="shared/shell.js"></script>
<script src="assets/app.js"></script>
<script>
Shell.init({ title: 'Service Control', active: 'services.html' });

let currentPage = 1, totalPages = 1;
const SERVICE_STATUS_ALIASES = { open:'pending', pending:'pending', assigned:'confirmed', accepted:'confirmed', confirmed:'confirmed', started:'in_progress', ongoing:'in_progress', in_progress:'in_progress', delivered:'completed', completed:'completed', rejected:'cancelled', cancelled:'cancelled' };

function normalizeServiceStatus(status) {
  return SERVICE_STATUS_ALIASES[String(status || 'pending').toLowerCase()] || String(status || 'pending').toLowerCase();
}

async function loadServiceBookings() {
  tableLoading('service-bookings-tbody', 8);
  try {
    const params = {};
    const q = document.getElementById('booking-search')?.value.trim();
    const phone = document.getElementById('booking-phone')?.value.trim();
    const vendor = document.getElementById('booking-vendor')?.value.trim();
    const status = document.getElementById('booking-status')?.value;
    if (q) params.q = q;
    if (phone) params.phone = phone;
    if (vendor) params.vendor_id = vendor;
    if (status) params.status = status;
    const data = await API.get(CONFIG.ENDPOINTS.SERVICE_BOOKINGS, params);
    const bookings = (data.bookings || data.data || []).map(b => ({ ...b, status: normalizeServiceStatus(b.status || b.job_status), amount: b.amount ?? b.total ?? b.price }));
    document.getElementById('booking-count').textContent = `${bookings.length.toLocaleString()} recent service bookings`;
    renderServiceBookings(bookings);
  } catch(e) {
    tableEmpty('service-bookings-tbody', 8, 'Failed to load service bookings: ' + (e.message || ''));
  }
}

function resetBookingFilters() {
  ['booking-search','booking-phone','booking-vendor','booking-status'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  loadServiceBookings();
}

function renderServiceBookings(bookings) {
  const tbody = document.getElementById('service-bookings-tbody');
  if (!bookings.length) { tableEmpty('service-bookings-tbody', 8, 'No service bookings yet. Confirm pilot services/vendors are seeded before public testing.'); return; }
  tbody.innerHTML = bookings.map(b => {
    const id = b.id || b._id;
    const jobId = b.job_id || id;
    const status = normalizeServiceStatus(b.status);
    const canAdvance = !['completed','cancelled'].includes(status);
    const createdAt = new Date(b.created_at || Date.now()).getTime();
    const pendingTooLong = status === 'pending' && (Date.now() - createdAt) > 30 * 60 * 1000;
    const phone = b.customer_phone || '';
    const wa = phone ? 'https://wa.me/91' + String(phone).replace(/\D/g,'').replace(/^91/,'') + '?text=' + encodeURIComponent('Hi, this is WorkToGo support about booking #' + id) : '';
    return `<tr>
      <td><div style="font-size:12px;color:var(--text-primary)">#${escHtml(String(id))}</div><div style="font-size:10px;color:${pendingTooLong?'var(--red)':'var(--text-muted)'}">${pendingTooLong?'⚠ Pending >30m':escHtml(b.booking_number||'')}</div></td>
      <td><div>${escHtml(b.customer_name||b.user_name||'—')}</div><div style="font-size:10px;color:var(--text-muted)">${escHtml(b.customer_phone||'')}</div></td>
      <td>${escHtml(b.service_name||'Service')}</td>
      <td>${Fmt.date(b.scheduled_at||b.created_at)}</td>
      <td>${escHtml(b.vendor_name||'Unassigned')}</td>
      <td>${statusBadge(status)}</td>
      <td><div>${escHtml(b.payment_method||'cod')}</div><div style="font-size:10px;color:var(--text-muted)">${escHtml(b.payment_status||'unpaid')}</div></td>
      <td><div class="td-actions">
        ${phone ? `<a class="btn btn-sm btn-ghost" href="tel:${escHtml(phone)}">Call</a><a class="btn btn-sm btn-ghost" href="${wa}" target="_blank" rel="noopener">WA</a>` : ''}
        ${canAdvance ? `<button class="btn btn-sm btn-ghost" onclick="adminSetJobStatus('${jobId}','confirmed')">Confirm</button>
        <button class="btn btn-sm btn-ghost" onclick="adminSetJobStatus('${jobId}','in_progress')">Progress</button>
        <button class="btn btn-sm btn-success" onclick="adminSetJobStatus('${jobId}','completed')">Complete</button>
        <button class="btn btn-sm btn-warn" onclick="adminSetJobStatus('${jobId}','cancelled')">Cancel</button>` : '—'}
      </div></td>
    </tr>`;
  }).join('');
}

async function adminSetJobStatus(jobId, status) {
  if (!await confirmAction(`Set this service booking to ${status.replace('_',' ')}?`)) return;
  try {
    await API.patch(CONFIG.ENDPOINTS.SERVICE_JOB_STATUS(jobId), { status });
    Toast.success('Service booking updated.');
    loadServiceBookings();
  } catch(e) { Toast.error(e.message || 'Failed to update booking'); }
}

async function loadServices(page = 1) {
  currentPage = page;
  tableLoading('services-tbody', 7);
  const params = { page, limit: CONFIG.DEFAULT_PAGE_SIZE };
  const search = document.getElementById('search-input').value.trim();
  const status = document.getElementById('status-filter').value;
  if (search) params.search = search;
  if (status) params.status = status;

  try {
    const data = await API.get(CONFIG.ENDPOINTS.SERVICES, params);
    const services = data.services || data.data || [];
    const total = data.total || services.length;
    totalPages = Math.ceil(total / CONFIG.DEFAULT_PAGE_SIZE);
    document.getElementById('service-count').textContent = `${total.toLocaleString()} total services`;
    renderServices(services);
    buildPagination('services-pagination', currentPage, totalPages, loadServices);
  } catch(e) {
    tableEmpty('services-tbody', 7, 'Failed: ' + (e.message||''));
    Toast.error('Failed to load services');
  }
}

function renderServices(services) {
  const tbody = document.getElementById('services-tbody');
  if (!services.length) { tableEmpty('services-tbody', 7); return; }
  tbody.innerHTML = services.map(s => {
    const id = s.id || s._id;
    const status = s.status || 'enabled';
    return `<tr>
      <td>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:32px;height:32px;border-radius:6px;background:var(--purple-dim);color:var(--purple);display:flex;align-items:center;justify-content:center;font-size:16px">🔧</div>
          <div>
            <div style="font-size:12px;color:var(--text-primary)">${Fmt.truncate(s.name||s.title,26)}</div>
            <div style="font-size:10px;color:var(--text-muted)">${s.duration ? s.duration + ' min' : ''}</div>
          </div>
        </div>
      </td>
      <td>${Fmt.truncate(s.vendorName||s.vendor?.name,20)||'—'}</td>
      <td><span class="badge badge-purple">${s.category||'—'}</span></td>
      <td style="color:var(--accent)">${Fmt.currency(s.basePrice||s.price)}</td>
      <td style="color:var(--text-muted)">${s.bookingCount??'—'}</td>
      <td>${statusBadge(status)}</td>
      <td>
        <div class="td-actions">
          <button class="btn btn-sm ${status === 'active' ? 'btn-warn' : 'btn-success'}" onclick="toggleService('${id}','${status === 'active' ? 'inactive' : 'active'}')">${status === 'active' ? 'Disable' : 'Enable'}</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

async function toggleService(id, newStatus) {
  const action = newStatus === 'disabled' ? 'disable' : 'enable';
  if (!await confirmAction(`${Fmt.capitalize(action)} this service?`)) return;
  try {
    await API.patch(CONFIG.ENDPOINTS.SERVICE_STATUS(id), { status: newStatus });
    Toast.success(`Service ${action}d.`); loadServices(currentPage);
  } catch(e) { Toast.error(e.message||'Failed'); }
}

document.getElementById('apply-filter').addEventListener('click', () => loadServices(1));
document.getElementById('search-input').addEventListener('keydown', e => { if(e.key==='Enter') loadServices(1); });
loadServices(1);
loadServiceBookings();
</script>
</body>
</html>
