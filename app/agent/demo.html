<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0d12" />
  <title>WorkToGo Assistant — Demo</title>
  <!--
    Standalone, backend-free preview of the agent chat UI.
    Open this file directly in a browser (or serve app/agent/demo.html).
    It runs the REAL chat UI (agent.js + agent.css) against the built-in MOCK
    transport — no login, no API key, no server needed. Try:
      "painter chahiye" → vendor cards → Book now → confirm → booking created
      "painting packages" → package cards
      "expert visit" → price → Request visit → confirm
  -->
  <style>html,body{margin:0;background:#0c0d12;height:100%;}#app{height:100dvh;}</style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.WTG_AGENT_MOCK = true;
    window.WTG_ASSET_VERSION = "demo";
  </script>
  <script type="module">
    import { render } from "./agent.js";
    render(document.getElementById("app"), { mock: true });
  </script>
</body>
</html>
