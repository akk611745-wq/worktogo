<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WorkToGo Rider</title>
<link rel="icon" href="/app/assets/favicon.png"/>
<style>
/* ── Rider panel — own scope, mobile-first ───────────────────────────────── */
:root{--r-bg:#0f1720;--r-surface:#17222e;--r-line:#243343;--r-ink:#eaf2f8;--r-muted:#8fa3b5;--r-brand:#12b886;--r-brand-ink:#0b7a5a;--r-accent:#ff6b35;--r-danger:#e5484d;}
*{box-sizing:border-box;} html,body{margin:0;background:var(--r-bg);color:var(--r-ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;background:var(--r-surface);border-bottom:1px solid var(--r-line);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:10;}
.brand{font-weight:800;font-size:16px;} .brand span{color:var(--r-brand);}
.body{flex:1;padding:16px;}
.card{background:var(--r-surface);border:1px solid var(--r-line);border-radius:14px;padding:14px;margin-bottom:12px;}
.muted{color:var(--r-muted);font-size:12px;}
.big{font-size:22px;font-weight:800;}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--r-muted);margin-bottom:6px;}
input{width:100%;background:var(--r-bg);border:1px solid var(--r-line);border-radius:11px;padding:12px;color:var(--r-ink);font-size:15px;outline:none;margin-bottom:12px;}
input:focus{border-color:var(--r-brand);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:800;cursor:pointer;}
.btn-primary{background:var(--r-brand);color:#04211a;} .btn-block{width:100%;}
.btn-ghost{background:transparent;border:1px solid var(--r-line);color:var(--r-ink);}
.btn-accent{background:var(--r-accent);color:#2a0f04;} .btn-danger{background:transparent;border:1px solid var(--r-danger);color:#ffb4b6;}
.switch{display:flex;align-items:center;gap:10px;}
.toggle{width:52px;height:30px;border-radius:99px;background:var(--r-line);position:relative;cursor:pointer;transition:.15s;flex:0 0 auto;}
.toggle.on{background:var(--r-brand);} .toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s;} .toggle.on::after{left:25px;}
.job{background:var(--r-surface);border:1px solid var(--r-line);border-radius:14px;padding:14px;margin-bottom:12px;}
.job .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.job .nm{font-weight:800;font-size:15px;} .job .sub{font-size:12px;color:var(--r-muted);margin-top:3px;}
.job .payout{font-size:15px;font-weight:800;color:var(--r-brand);}
.leg{display:flex;gap:8px;font-size:12px;color:var(--r-muted);margin:10px 0;align-items:center;}
.job-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;} .job-actions .btn{flex:1;}
.pill{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:3px 9px;border-radius:99px;background:var(--r-line);color:var(--r-ink);}
.pill.assigned{background:#243b52;color:#8ec5ff;} .pill.picked{background:#3a2f12;color:#ffcf6b;}
.empty{text-align:center;padding:40px 16px;color:var(--r-muted);} .empty .ic{font-size:42px;}
.stat{display:flex;gap:12px;} .stat>div{flex:1;background:var(--r-bg);border-radius:11px;padding:10px 12px;} .stat .v{font-size:18px;font-weight:800;} .stat .l{font-size:11px;color:var(--r-muted);}
.hidden{display:none!important;} .spin{width:26px;height:26px;border:3px solid var(--r-line);border-top-color:var(--r-brand);border-radius:50%;animation:sp .8s linear infinite;margin:24px auto;} @keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;z-index:50;} .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><div class="brand">Work<span>ToGo</span> Rider</div>
    <button class="btn btn-ghost hidden" id="logout-btn" style="padding:7px 12px;font-size:12px" onclick="Rider.logout()">Log out</button></div>
  <div class="body" id="app"><div class="spin"></div></div>
</div>
<div class="toast" id="toast"></div>
<script src="rider.js"></script>
</body>
</html>
